<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Input Test</title><style>body{font-family:Arial,sans-serif;background:#07101f;color:white;min-height:100vh;display:grid;place-items:center;margin:0}.box{width:min(420px,90vw);padding:24px;background:#101a2e;border:1px solid #334;border-radius:16px}input{display:block;width:100%;box-sizing:border-box;padding:14px;margin:12px 0;border-radius:10px;border:1px solid #567;background:white;color:black;font-size:18px}button{padding:12px 16px;border:0;border-radius:10px;cursor:pointer}#result{margin-top:14px;color:#7ff}</style></head><body><div class="box"><h1>Tes Input</h1><p>Ketik apa pun di bawah.</p><input id="test" type="text" placeholder="Ketik di sini" autofocus><button onclick="document.getElementById('result').textContent='Input terbaca: '+document.getElementById('test').value">Tes</button><div id="result"></div></div></body></html>
