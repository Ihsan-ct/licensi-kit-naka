<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Kit Naka — License Security</title>
<style>
:root{--bg:#080d12;--panel:#101821;--line:#22303d;--text:#e6edf3;--dim:#8ca0b3;--accent:#59d8ff;--ok:#4ade80;--warn:#facc15;--danger:#fb7185}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,Segoe UI,sans-serif}.wrap{max-width:1450px;margin:auto;padding:32px 22px 70px}header{display:flex;justify-content:space-between;gap:18px;align-items:flex-end;flex-wrap:wrap;margin-bottom:22px}h1{font-size:21px;margin:0}.sub,.mono{font-family:ui-monospace,Consolas,monospace;color:var(--dim);font-size:12px}.stats{display:flex;border:1px solid var(--line);border-radius:12px;overflow:hidden}.stat{padding:10px 18px;text-align:center;border-right:1px solid var(--line)}.stat:last-child{border:0}.stat b{display:block;font:700 19px ui-monospace}.stat span{font:10px ui-monospace;color:var(--dim);text-transform:uppercase}.danger b{color:var(--danger)}.ok b{color:var(--ok)}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}.toolbar input{flex:1;min-width:220px;background:var(--panel);border:1px solid var(--line);color:var(--text);padding:10px 12px;border-radius:8px}.btn{background:var(--panel);border:1px solid var(--line);color:var(--dim);padding:9px 12px;border-radius:8px;cursor:pointer;font:12px ui-monospace}.btn:hover,.btn.active{border-color:var(--accent);color:var(--accent)}.btn.red{color:var(--danger)}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:12px}table{width:100%;border-collapse:collapse;min-width:1100px}th{text-align:left;color:var(--dim);font:10px ui-monospace;text-transform:uppercase;padding:11px;border-bottom:1px solid var(--line)}td{padding:12px 11px;border-bottom:1px solid var(--line);font-size:12px;vertical-align:top}tr:last-child td{border-bottom:0}tr:hover{background:#ffffff05}.badge{display:inline-block;padding:3px 7px;border:1px solid var(--line);border-radius:5px;font:10px ui-monospace;text-transform:uppercase}.badge.active{color:var(--ok);border-color:#4ade8055}.badge.unauthorized,.badge.revoked{color:var(--danger);border-color:#fb718555}.badge.pending,.badge.suspended{color:var(--warn);border-color:#facc1555}.name{font-weight:700}.muted{color:var(--dim);margin-top:3px}.actions{display:flex;gap:5px;flex-wrap:wrap}.small{padding:5px 8px;font-size:10px}.empty{text-align:center;color:var(--dim);padding:55px}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--panel);border:1px solid var(--accent);padding:10px 16px;border-radius:8px;display:none;z-index:20}.toast.show{display:block}.modal-bg{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;padding:20px;z-index:10}.modal-bg.show{display:flex}.modal{width:min(560px,100%);background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:22px}.modal h2{margin-top:0}.field{display:grid;grid-template-columns:150px 1fr;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);font-size:12px}.field .k{color:var(--dim);font-family:ui-monospace}.field .v{word-break:break-all}.key-box{background:#05090d;border:1px solid var(--danger);padding:12px;border-radius:8px;font:12px ui-monospace;word-break:break-all;margin:12px 0}.notice{color:var(--warn);font-size:12px}.login{max-width:430px;margin:12vh auto;background:var(--panel);border:1px solid var(--line);padding:24px;border-radius:14px}.login input{width:100%;margin:12px 0;background:var(--bg);border:1px solid var(--line);color:var(--text);padding:12px;border-radius:8px}@media(max-width:700px){.stats{width:100%;overflow:auto}.stat{min-width:90px}.wrap{padding:20px 12px}.toolbar input{width:100%}}
</style>
</head>
<body>
<div id="loginView" class="login">
  <h2>License Security Dashboard</h2>
  <div class="sub">Masukkan ADMIN_SECRET untuk membuka data.</div>
  <input id="secretInput" type="password" placeholder="ADMIN_SECRET" autocomplete="current-password" />
  <button class="btn" id="loginBtn">Masuk</button>
</div>
<div id="app" class="wrap" hidden>
<header><div><h1>KIT NAKA — LICENSE SECURITY</h1><div class="sub" id="lastRefresh">belum dimuat</div></div><div class="stats"><div class="stat ok"><b id="sActive">0</b><span>Aktif</span></div><div class="stat"><b id="sMaps">0</b><span>Map</span></div><div class="stat danger"><b id="sUnauthorized">0</b><span>Tanpa Lisensi</span></div><div class="stat"><b id="sTotal">0</b><span>Total Baris</span></div></div></header>
<div class="toolbar">
  <input id="search" placeholder="Cari owner, map, place, universe, alasan..." />
  <button class="btn active filter" data-filter="all">Semua</button>
  <button class="btn filter" data-filter="license">Ber-lisensi</button>
  <button class="btn filter" data-filter="unauthorized">Tanpa Lisensi</button>
  <button class="btn" id="refreshBtn">↻ Refresh</button>
  <button class="btn" id="addBtn">+ Tambah Lisensi</button>
  <button class="btn red" id="logoutBtn">Keluar</button>
</div>
<div class="table-wrap"><table><thead><tr><th>Tipe</th><th>Map / Produk</th><th>Owner</th><th>Universe / Place</th><th>Status / Alasan</th><th>Versi</th><th>Terakhir</th><th>IP</th><th>Aksi</th></tr></thead><tbody id="tbody"></tbody></table><div class="empty" id="empty" hidden>Tidak ada data.</div></div>
</div>
<div class="toast" id="toast"></div>
<div class="modal-bg" id="modalBg"><div class="modal"><h2 id="modalTitle">Detail</h2><div id="modalBody"></div><button class="btn" id="modalClose" style="width:100%;margin-top:15px">Tutup</button></div></div>
<script>
const API='/api/licenses';
let secret=sessionStorage.getItem('kn_admin_secret')||'';
let licenses=[],unauthorized=[],rows=[],visible=[],filter='all',query='';
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(m){$('toast').textContent=m;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),2200)}
function timeAgo(v){if(!v)return'—';const n=Date.now()-new Date(v).getTime(),m=Math.floor(n/60000);if(m<1)return'baru saja';if(m<60)return m+' menit lalu';const h=Math.floor(m/60);if(h<24)return h+' jam lalu';return Math.floor(h/24)+' hari lalu'}
function randomKey(){const a=new Uint8Array(24);crypto.getRandomValues(a);return 'NAKA-'+[...a].map(x=>x.toString(16).padStart(2,'0')).join('').toUpperCase()}
async function api(method='GET',body){const r=await fetch(API,{method,headers:{'Content-Type':'application/json','x-admin-secret':secret},body:body?JSON.stringify(body):undefined});let j={};try{j=await r.json()}catch{}if(!r.ok){if(r.status===401)logout();throw new Error(j.error||('HTTP '+r.status))}return j}
function login(){const v=$('secretInput').value.trim();if(!v)return;secret=v;sessionStorage.setItem('kn_admin_secret',v);$('loginView').hidden=true;$('app').hidden=false;load()}
function logout(){secret='';sessionStorage.removeItem('kn_admin_secret');$('app').hidden=true;$('loginView').hidden=false;$('secretInput').value=''}
async function load(){try{const j=await api();licenses=j.licenses||[];unauthorized=j.unauthorized||[];rows=[...unauthorized,...licenses];$('lastRefresh').textContent='Refresh: '+new Date().toLocaleString('id-ID');render()}catch(e){toast(e.message)}}
function render(){const q=query.toLowerCase();visible=rows.filter(r=>{if(filter!=='all'&&r.record_type!==filter)return false;const hay=[r.owner_id,r.owner_type,r.product,r.place_name,r.game_name,r.place_id,r.universe_id,r.reason,r.ip_address,r.status].join(' ').toLowerCase();return !q||hay.includes(q)});$('sActive').textContent=new Set(licenses.filter(x=>x.status==='active').map(x=>`${x.owner_id}:${x.product}`)).size;$('sMaps').textContent=licenses.filter(x=>x.ever_connected).length;$('sUnauthorized').textContent=unauthorized.length;$('sTotal').textContent=rows.length;$('empty').hidden=visible.length>0;$('tbody').innerHTML=visible.map((r,i)=>{const una=r.record_type==='unauthorized';const status=una?'unauthorized':(r.status||'unknown');return `<tr><td><span class="badge ${esc(status)}">${una?'TANPA LISENSI':'LISENSI'}</span></td><td><div class="name">${esc(r.place_name||r.game_name||'Tanpa nama')}</div><div class="muted">${esc(r.product||'—')}</div></td><td class="mono">${esc(r.owner_id||'—')}<div class="muted">${esc(r.owner_type||'—')}</div></td><td class="mono">U: ${esc(r.universe_id||r.universe_id_bound||'—')}<div>P: ${esc(r.place_id||'—')}</div></td><td><span class="badge ${esc(status)}">${esc(una?(r.reason||'unauthorized'):status)}</span></td><td class="mono">${esc(r.system_version||'—')}</td><td class="mono">${esc(timeAgo(r.last_seen_at||r.attempted_at))}</td><td class="mono">${esc(una?(r.ip_address||'—'):'—')}</td><td><div class="actions"><button class="btn small" data-a="detail" data-i="${i}">Detail</button>${!una?`<button class="btn small" data-a="reset" data-i="${i}">Reset Universe</button><button class="btn small" data-a="toggle" data-i="${i}">${r.status==='active'?'Revoke':'Aktifkan'}</button><button class="btn small red" data-a="delete" data-i="${i}">Hapus</button>`:''}</div></td></tr>`}).join('')}
function detail(r){$('modalTitle').textContent=r.record_type==='unauthorized'?'Percobaan Tanpa Lisensi':'Detail Lisensi';const fields=[['Tipe',r.record_type],['Owner',`${r.owner_id||'—'} (${r.owner_type||'—'})`],['Produk',r.product],['Status',r.status],['Alasan',r.reason],['Universe ID',r.universe_id||r.universe_id_bound],['Place ID',r.place_id],['Map',r.place_name||r.game_name],['Versi',r.system_version],['IP',r.ip_address],['User Agent',r.user_agent],['Pertama Aktif',r.activated_at],['Terakhir',r.last_seen_at||r.attempted_at],['Kadaluarsa',r.expires_at]];$('modalBody').innerHTML=fields.map(([k,v])=>`<div class="field"><div class="k">${esc(k)}</div><div class="v">${esc(v||'—')}</div></div>`).join('');$('modalBg').classList.add('show')}
async function addLicense(){const ownerId=prompt('Owner ID Roblox:');if(!ownerId)return;const ownerType=(prompt('Owner Type: User atau Group','User')||'User').trim();const product=(prompt('Produk:','kit-naka')||'kit-naka').trim();const universeId=(prompt('Universe ID opsional (kosong = bind saat aktivasi pertama):','')||'').trim();const licenseKey=randomKey();try{await api('POST',{ownerId,ownerType,product,universeId:universeId||null,licenseKey,status:'active'});$('modalTitle').textContent='License Key Baru';$('modalBody').innerHTML=`<div class="notice">Simpan dan kirim key ini kepada pembeli. Key tidak dapat dilihat lagi dari dashboard.</div><div class="key-box">${esc(licenseKey)}</div><button class="btn" id="copyKey">Salin Key</button>`;$('modalBg').classList.add('show');setTimeout(()=>{const b=$('copyKey');if(b)b.onclick=()=>navigator.clipboard.writeText(licenseKey).then(()=>toast('Key disalin'))},0);load()}catch(e){toast(e.message)}}
async function mutate(r,action){try{if(action==='reset'){if(!confirm('Reset binding Universe ID lisensi ini?'))return;await api('PATCH',{ownerId:r.owner_id,ownerType:r.owner_type,product:r.product,resetUniverse:true})}if(action==='toggle'){const status=r.status==='active'?'revoked':'active';if(!confirm(`Ubah status menjadi ${status}?`))return;await api('PATCH',{ownerId:r.owner_id,ownerType:r.owner_type,product:r.product,status})}if(action==='delete'){if(!confirm('Hapus lisensi permanen?'))return;await api('DELETE',{ownerId:r.owner_id,ownerType:r.owner_type,product:r.product})}toast('Perubahan tersimpan');load()}catch(e){toast(e.message)}}
$('tbody').onclick=e=>{const b=e.target.closest('button[data-a]');if(!b)return;const r=visible[Number(b.dataset.i)];if(!r)return;b.dataset.a==='detail'?detail(r):mutate(r,b.dataset.a)};
$('loginBtn').onclick=login;$('secretInput').onkeydown=e=>{if(e.key==='Enter')login()};$('refreshBtn').onclick=load;$('addBtn').onclick=addLicense;$('logoutBtn').onclick=logout;$('search').oninput=e=>{query=e.target.value;render()};document.querySelectorAll('.filter').forEach(b=>b.onclick=()=>{document.querySelectorAll('.filter').forEach(x=>x.classList.remove('active'));b.classList.add('active');filter=b.dataset.filter;render()});$('modalClose').onclick=()=> $('modalBg').classList.remove('show');$('modalBg').onclick=e=>{if(e.target===$('modalBg'))$('modalBg').classList.remove('show')};if(secret){$('loginView').hidden=true;$('app').hidden=false;load()}
</script>
</body>
</html>
